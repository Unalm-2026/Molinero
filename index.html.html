    const STORAGE_KEY = 'practica_unalm_state_v1';

    let state = {
      tab: 'temario', // 'temario' | 'practicar' | 'simulacro' | 'banco'
      theme: 'light',
      expandedCourseId: 'rv',
      customQuestions: [],
      // Estado de pestaña Practicar
      practice: {
        areaFilter: 'all',
        courseFilter: 'all',
        topicFilter: 'all',
        queue: [],
        index: 0,
        selected: null,
        resolved: false,
        wasBlank: false,
        stats: { correct: 0, incorrect: 0, blank: 0 }
      },
      // Estado de pestaña Simulacro
      simulacro: {
        phase: 'setup', // 'setup' | 'running' | 'results'
        questions: [],
        answers: {}, // { [idx]: optionIndex }
        currentIndex: 0,
        secondsLeft: 0,
        timerId: null
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.theme = parsed.theme || 'light';
          state.customQuestions = Array.isArray(parsed.customQuestions) ? parsed.customQuestions : [];
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          state.theme = 'dark';
        }
      } catch (e) {
        console.error('Error al leer localStorage:', e);
      }
      applyTheme();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          theme: state.theme,
          customQuestions: state.customQuestions
        }));
      } catch (e) {
        console.error('Error al guardar en localStorage:', e);
      }
    }

    function getAllQuestions() {
      return [...INITIAL_QUESTIONS, ...state.customQuestions];
    }

    function getCourse(courseId) {
      return COURSES.find(c => c.id === courseId);
    }

    function getArea(areaId) {
      return AREAS.find(a => a.id === areaId);
    }

    function calcScore(correct, incorrect) {
      return (correct * SCORE_CORRECT) + (incorrect * SCORE_INCORRECT);
    }

    function formatScore(value) {
      const fixed = value.toFixed(2);
      if (value > 0) return '+' + fixed;
      return fixed;
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ===========================================================
       4. TEMA, CUENTA REGRESIVA, TOASTS Y MODALES
       =========================================================== */
    function applyTheme() {
      const root = document.documentElement;
      const sun = document.getElementById('icon-sun');
      const moon = document.getElementById('icon-moon');
      if (state.theme === 'dark') {
        root.classList.add('dark');
        if (sun) sun.classList.remove('hidden');
        if (moon) moon.classList.add('hidden');
      } else {
        root.classList.remove('dark');
        if (sun) sun.classList.add('hidden');
        if (moon) moon.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    }

    function updateCountdown() {
      const el = document.getElementById('countdown-display');
      if (!el) return;

      const targetTime = new Date(EXAM_TARGET_ISO).getTime();
      const now = Date.now();
      const diff = targetTime - now;

      if (diff <= 0) {
        el.innerHTML = '<span>Examen en curso o finalizado</span>';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      el.innerHTML = `
        <span>${days}d</span>
        <span>${String(hours).padStart(2, '0')}h</span>
        <span>${String(minutes).padStart(2, '0')}m</span>
        <span>${String(seconds).padStart(2, '0')}s</span>
      `;
    }

    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const div = document.createElement('div');
      div.className = `pointer-events-auto px-4 py-2.5 rounded-lg border text-xs font-medium shadow-md transition-opacity duration-200 ${
        isError
          ? 'bg-red-700 text-white border-red-800'
          : 'bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 border-neutral-800 dark:border-neutral-300'
      }`;
      div.textContent = message;
      container.appendChild(div);
      setTimeout(() => {
        div.style.opacity = '0';
        setTimeout(() => div.remove(), 250);
      }, 2800);
    }

    function openConfirmModal(title, body, onConfirm, okLabel = 'Confirmar') {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      const btnOk = document.getElementById('modal-ok');
      const btnCancel = document.getElementById('modal-cancel');
      btnOk.textContent = okLabel;
      modal.classList.remove('hidden');

      const close = () => {
        modal.classList.add('hidden');
        btnOk.onclick = null;
        btnCancel.onclick = null;
      };
      btnCancel.onclick = close;
      btnOk.onclick = () => {
        close();
        if (onConfirm) onConfirm();
      };
    }

    /* ===========================================================
       5. NAVEGACIÓN ENTRE PESTAÑAS
       =========================================================== */
    function navigate(tab) {
      if (state.tab === 'simulacro' && state.simulacro.phase === 'running' && tab !== 'simulacro') {
        openConfirmModal(
          'Salir del simulacro',
          'Hay un simulacro en curso. Si cambias de pestaña perderás el avance de este intento.',
          () => {
            stopSimulacroTimer();
            state.simulacro.phase = 'setup';
            state.tab = tab;
            if (tab === 'practicar' && state.practice.queue.length === 0) {
              buildPracticeQueue();
            }
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          },
          'Salir'
        );
        return;
      }

      state.tab = tab;
      if (tab === 'practicar' && state.practice.queue.length === 0) {
        buildPracticeQueue();
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavStyles() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === state.tab;
        btn.className = `tab-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
          active
            ? 'bg-unalm-50 dark:bg-unalm-900/40 text-unalm-700 dark:text-unalm-200'
            : 'text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white'
        }`;
      });

      document.querySelectorAll('.tab-mob-btn').forEach(btn => {
        const active = btn.dataset.tabMob === state.tab;
        btn.className = `tab-mob-btn py-1.5 rounded-lg text-xs font-medium text-center transition-colors ${
          active
            ? 'bg-unalm-50 dark:bg-unalm-900/40 text-unalm-700 dark:text-unalm-200 font-semibold'
            : 'text-neutral-600 dark:text-neutral-400'
        }`;
      });
    }

    function render() {
      updateNavStyles();
      const root = document.getElementById('app-root');
      if (state.tab === 'temario') root.innerHTML = renderTemario();
      else if (state.tab === 'practicar') root.innerHTML = renderPracticar();
      else if (state.tab === 'simulacro') root.innerHTML = renderSimulacro();
      else if (state.tab === 'banco') root.innerHTML = renderBanco();
    }

    function toggleCourseAccordion(courseId) {
      state.expandedCourseId = state.expandedCourseId === courseId ? null : courseId;

      const course = getCourse(courseId);
      state.practice.areaFilter = course ? course.areaId : 'all';
      state.practice.courseFilter = courseId;
      state.practice.topicFilter = topic;
      buildPracticeQueue();
      state.tab = 'practicar';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

              <h2 class="font-semibold text-sm sm:text-base text-neutral-900 dark:text-white">${area.name}</h2>
              <span class="text-xs font-medium text-neutral-500 dark:text-neutral-400">${area.officialCount} preguntas en examen</span>
            </div>
            <div class="space-y-2">
              ${coursesHtml}
            </div>
          </section>
        `;
      }).join('');

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">Temario Oficial de Admisión UNALM</h1>
              <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">
                Estructura oficial del examen: 100 preguntas distribuidas en 4 áreas y 12 cursos, con una duración de 180 minutos.
              </p>
            </div>
            <div class="text-xs text-neutral-500 dark:text-neutral-400 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg px-3 py-2 shrink-0">
              Total en banco actual: <strong class="text-neutral-900 dark:text-white">${allQ.length} preguntas</strong>
            </div>
          </div>

          <div class="space-y-6">
            ${areasHtml}
          </div>
        </div>
      `;
    }

    /* ===========================================================
       7. PESTAÑA 2: PRACTICAR CON FILTROS Y PUNTAJE ACUMULADO
       =========================================================== */
    function buildPracticeQueue() {
      const p = state.practice;
      const allQ = getAllQuestions();

      let filtered = allQ.filter(q => {
        const course = getCourse(q.course);
        if (!course) return false;
        if (p.areaFilter !== 'all' && course.areaId !== p.areaFilter) return false;
        if (p.courseFilter !== 'all' && q.course !== p.courseFilter) return false;
        if (p.topicFilter !== 'all' && q.topic !== p.topicFilter) return false;
        return true;
      });

      p.queue = shuffle(filtered);
      p.index = 0;
      p.selected = null;
      p.resolved = false;
      p.wasBlank = false;
    }

    function onPracticeAreaChange(areaId) {
      state.practice.areaFilter = areaId;
      state.practice.courseFilter = 'all';
      state.practice.topicFilter = 'all';
      buildPracticeQueue();
      render();
    }

    function onPracticeCourseChange(courseId) {
      state.practice.courseFilter = courseId;
      if (courseId !== 'all') {
        const c = getCourse(courseId);
        if (c) state.practice.areaFilter = c.areaId;
      }
      state.practice.topicFilter = 'all';
      buildPracticeQueue();
      render();
    }

    function onPracticeTopicChange(topic) {
      state.practice.topicFilter = topic;
      buildPracticeQueue();
      render();
    }

    function answerPractice(optIdx) {
      const p = state.practice;
      if (p.resolved) return;
      const q = p.queue[p.index];
      if (!q) return;

      p.selected = optIdx;
      p.resolved = true;
      p.wasBlank = false;

      if (optIdx === q.answer) p.stats.correct += 1;
      else p.stats.incorrect += 1;

      render();
    }

    function skipPracticeBlank() {
      const p = state.practice;
      if (p.resolved) return;
      p.selected = null;
      p.resolved = true;
      p.wasBlank = true;
      p.stats.blank += 1;
      render();
    }

    function nextPractice() {
      const p = state.practice;
      if (p.index < p.queue.length - 1) {
        p.index += 1;
        p.selected = null;
        p.resolved = false;
        p.wasBlank = false;
      } else {
        // Reiniciar cola mezclada al terminar
        buildPracticeQueue();
        showToast('Se completó el lote filtrado. Se ha mezclado nuevamente.');
      }
      render();
    }

    function resetPracticeStats() {
      state.practice.stats = { correct: 0, incorrect: 0, blank: 0 };
      render();
      showToast('Puntaje de práctica reiniciado.');
    }

    function renderPracticar() {
      const p = state.practice;
      const letters = ['A', 'B', 'C', 'D', 'E'];

      // Cursos disponibles según área
      const availableCourses = p.areaFilter === 'all'
        ? COURSES
        : COURSES.filter(c => c.areaId === p.areaFilter);

      // Temas disponibles según curso
      const selectedCourseObj = p.courseFilter !== 'all' ? getCourse(p.courseFilter) : null;
      const availableTopics = selectedCourseObj ? selectedCourseObj.topics : [];

      const totalScore = calcScore(p.stats.correct, p.stats.incorrect);
      const q = p.queue[p.index];

      let questionCardHtml = '';
      if (!q) {
        questionCardHtml = `
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-8 text-center">
            <p class="text-sm font-medium text-neutral-700 dark:text-neutral-300">No hay preguntas registradas para el filtro seleccionado.</p>
            <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">Puedes elegir otro tema o agregar preguntas nuevas en la pestaña Banco.</p>
          </div>
        `;
      } else {
        const courseObj = getCourse(q.course);
        const optionsHtml = q.options.map((opt, idx) => {
          let cls = 'bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-700 hover:border-unalm-700 dark:hover:border-unalm-600 text-neutral-800 dark:text-neutral-100';
          let badgeCls = 'bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300';

          if (p.resolved) {
            if (idx === q.answer) {
              cls = 'bg-unalm-50 dark:bg-unalm-900/30 border-unalm-700 text-unalm-900 dark:text-unalm-100';
              badgeCls = 'bg-unalm-700 text-white';
            } else if (!p.wasBlank && idx === p.selected && idx !== q.answer) {
              cls = 'bg-red-50 dark:bg-red-950/30 border-red-600 text-red-900 dark:text-red-200';
              badgeCls = 'bg-red-600 text-white';
            } else {
              cls = 'bg-neutral-50 dark:bg-neutral-900/50 border-neutral-200 dark:border-neutral-800 text-neutral-400 dark:text-neutral-500';
            }
          }

          return `
            <button
              onclick="answerPractice(${idx})"
              ${p.resolved ? 'disabled' : ''}
              class="w-full text-left p-3.5 rounded-xl border transition-colors flex items-start gap-3 ${cls} ${p.resolved ? 'cursor-default' : 'cursor-pointer'}"
            >
              <span class="w-6 h-6 shrink-0 rounded-md text-xs font-semibold flex items-center justify-center ${badgeCls}">${letters[idx]}</span>
              <span class="text-sm leading-snug pt-0.5">${escapeHTML(opt)}</span>
            </button>
          `;
        }).join('');

        let feedbackHtml = '';
        if (p.resolved) {
          let statusTitle = '';
          let statusClass = '';
          if (p.wasBlank) {
            statusTitle = `Dejada en blanco (0.00 pts) — Clave correcta: ${letters[q.answer]}`;
            statusClass = 'bg-neutral-100 dark:bg-neutral-800/80 border-neutral-300 dark:border-neutral-700 text-neutral-800 dark:text-neutral-200';
          } else if (p.selected === q.answer) {
            statusTitle = 'Respuesta correcta (+1.00 pt)';
            statusClass = 'bg-unalm-50 dark:bg-unalm-900/25 border-unalm-200 dark:border-unalm-800 text-unalm-900 dark:text-unalm-100';
          } else {
            statusTitle = `Respuesta incorrecta (-0.17 pts) — Clave correcta: ${letters[q.answer]}`;
            statusClass = 'bg-red-50 dark:bg-red-950/30 border-red-200 dark:border-red-900 text-red-900 dark:text-red-200';
          }

          feedbackHtml = `
            <div class="mt-5 p-4 rounded-xl border ${statusClass}">
              <div class="font-semibold text-sm mb-1.5">${statusTitle}</div>
              <p class="text-xs sm:text-sm leading-relaxed opacity-90">${escapeHTML(q.explanation)}</p>
            </div>
            <div class="mt-4 flex justify-end">
              <button onclick="nextPractice()" class="px-5 py-2.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-sm font-medium transition-colors">
                Siguiente
              </button>
            </div>
          `;
        } else {
          feedbackHtml = `
            <div class="mt-4 flex justify-end">
              <button onclick="skipPracticeBlank()" class="px-4 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors">
                Dejar en blanco (0.00)
              </button>
            </div>
          `;
        }

        questionCardHtml = `
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-4 border-b border-neutral-100 dark:border-neutral-800 text-xs text-neutral-500 dark:text-neutral-400">
              <span><strong class="text-neutral-800 dark:text-neutral-200">${courseObj ? courseObj.name : q.course}</strong> &middot; ${escapeHTML(q.topic)}</span>
              <span class="tabular-nums">Pregunta ${p.index + 1} de ${p.queue.length}</span>
            </div>

            <p class="text-sm sm:text-base font-medium text-neutral-900 dark:text-white leading-relaxed mb-5">
              ${escapeHTML(q.question)}
            </p>

            <div class="space-y-2">
              ${optionsHtml}
            </div>

            ${feedbackHtml}
          </div>
        `;
      }

      return `
        <div class="space-y-5">
          <!-- Filtros -->
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1">Área</label>
              <select onchange="onPracticeAreaChange(this.value)" class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700">
                <option value="all" ${p.areaFilter === 'all' ? 'selected' : ''}>Todas las áreas</option>
                ${AREAS.map(a => `<option value="${a.id}" ${p.areaFilter === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1">Curso</label>
              <select onchange="onPracticeCourseChange(this.value)" class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700">
                <option value="all" ${p.courseFilter === 'all' ? 'selected' : ''}>Todos los cursos</option>
                ${availableCourses.map(c => `<option value="${c.id}" ${p.courseFilter === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1">Tema</label>
              <select onchange="onPracticeTopicChange(this.value)" ${p.courseFilter === 'all' ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm disabled:opacity-50 focus:outline-none focus:ring-1 focus:ring-unalm-700">
                <option value="all" ${p.topicFilter === 'all' ? 'selected' : ''}>Todos los temas</option>
                ${availableTopics.map(t => `<option value="${escapeHTML(t)}" ${p.topicFilter === t ? 'selected' : ''}>${escapeHTML(t)}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Resumen de puntaje acumulado -->
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm">
            <div class="flex flex-wrap items-center gap-4 tabular-nums">
              <span>Puntaje acumulado: <strong class="font-bold text-unalm-700 dark:text-unalm-200">${formatScore(totalScore)}</strong></span>
              <span class="text-neutral-500 dark:text-neutral-400">Correctas: <strong class="text-neutral-800 dark:text-neutral-200">${p.stats.correct}</strong></span>
              <span class="text-neutral-500 dark:text-neutral-400">Incorrectas: <strong class="text-neutral-800 dark:text-neutral-200">${p.stats.incorrect}</strong></span>
              <span class="text-neutral-500 dark:text-neutral-400">En blanco: <strong class="text-neutral-800 dark:text-neutral-200">${p.stats.blank}</strong></span>
            </div>
            <button onclick="resetPracticeStats()" class="text-xs font-medium text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-white underline">
              Reiniciar puntaje
            </button>
          </div>

          ${questionCardHtml}
        </div>
      `;
    }

    /* ===========================================================
       8. PESTAÑA 3: SIMULACRO CRONOMETRADO
       =========================================================== */
    function stopSimulacroTimer() {
      if (state.simulacro.timerId) {
        clearInterval(state.simulacro.timerId);
        state.simulacro.timerId = null;
      }
    }

    function formatClock(totalSeconds) {
      const m = Math.floor(Math.max(0, totalSeconds) / 60);
      const s = Math.max(0, totalSeconds) % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startSimulacro(mode) {
      const allQ = getAllQuestions();
      let selected = [];
      let minutes = 36;

      if (mode === 'quick') {
        const count = Math.min(20, allQ.length);
        selected = shuffle(allQ).slice(0, count);
        minutes = Math.max(1, Math.round(count * 1.8)); // 1.8 min por pregunta (proporcional a 180 min / 100 preg)
      } else {
        selected = shuffle(allQ);
        minutes = Math.max(1, Math.round(selected.length * 1.8));
      }

      stopSimulacroTimer();
      state.simulacro = {
        phase: 'running',
        questions: selected,
        answers: {},
        currentIndex: 0,
        secondsLeft: minutes * 60,
        timerId: null
      };

      state.simulacro.timerId = setInterval(() => {
        state.simulacro.secondsLeft -= 1;
        const clockEl = document.getElementById('sim-clock');
        if (clockEl) {
          clockEl.textContent = formatClock(state.simulacro.secondsLeft);
        }
        if (state.simulacro.secondsLeft <= 0) {
          finishSimulacro(true);
        }
      }, 1000);

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectSimOption(optIdx) {
      const idx = state.simulacro.currentIndex;
      if (state.simulacro.answers[idx] === optIdx) {
        delete state.simulacro.answers[idx];
      } else {
        state.simulacro.answers[idx] = optIdx;
      }
      render();
    }

    function clearSimOption() {
      delete state.simulacro.answers[state.simulacro.currentIndex];
      render();
    }

    function goToSimQuestion(idx) {
      if (idx < 0 || idx >= state.simulacro.questions.length) return;
      state.simulacro.currentIndex = idx;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function askFinishSimulacro() {
      const total = state.simulacro.questions.length;
      const answered = Object.keys(state.simulacro.answers).length;
      const blank = total - answered;
      openConfirmModal(
        'Finalizar simulacro',
        `Has marcado ${answered} de ${total} preguntas (${blank} en blanco). Se calculará tu puntaje con +1.00 por correcta, -0.17 por incorrecta y 0.00 en blanco.`,
        () => finishSimulacro(false),
        'Finalizar y calificar'
      );
    }

    function finishSimulacro(auto = false) {
      stopSimulacroTimer();
      state.simulacro.phase = 'results';
      if (auto) showToast('Tiempo finalizado. El simulacro se calificó automáticamente.');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSimulacro() {
      const sim = state.simulacro;
      const allQ = getAllQuestions();
      const letters = ['A', 'B', 'C', 'D', 'E'];

      // --- FASE 1: CONFIGURACIÓN ---
      if (sim.phase === 'setup') {
        const fullMin = Math.round(allQ.length * 1.8);
        return `
          <div class="max-w-2xl mx-auto space-y-6">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">Simulacro Cronometrado</h1>
              <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">
                Tiempo proporcional al examen oficial (1.8 minutos por pregunta). Puedes dejar preguntas en blanco para evitar la penalidad.
              </p>
            </div>

            <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 space-y-5">
              <div class="grid grid-cols-3 gap-3 text-center">
                <div class="p-3 rounded-lg bg-neutral-50 dark:bg-neutral-800/60 border border-neutral-200 dark:border-neutral-700">
                  <div class="font-bold text-base text-unalm-700 dark:text-unalm-200">+1.00</div>
                  <div class="text-xs text-neutral-500 dark:text-neutral-400">Correcta</div>
                </div>
                <div class="p-3 rounded-lg bg-neutral-50 dark:bg-neutral-800/60 border border-neutral-200 dark:border-neutral-700">
                  <div class="font-bold text-base text-red-600 dark:text-red-400">-0.17</div>
                  <div class="text-xs text-neutral-500 dark:text-neutral-400">Incorrecta</div>
                </div>
                <div class="p-3 rounded-lg bg-neutral-50 dark:bg-neutral-800/60 border border-neutral-200 dark:border-neutral-700">
                  <div class="font-bold text-base text-neutral-700 dark:text-neutral-300">0.00</div>
                  <div class="text-xs text-neutral-500 dark:text-neutral-400">En blanco</div>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="startSimulacro('quick')" class="p-4 rounded-xl border border-neutral-200 dark:border-neutral-700 hover:border-unalm-700 dark:hover:border-unalm-600 text-left transition-colors">
                  <div class="font-semibold text-sm text-neutral-900 dark:text-white">Simulacro Rápido</div>
                  <div class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">20 preguntas &middot; 36 minutos</div>
                </button>

                <button onclick="startSimulacro('full')" class="p-4 rounded-xl border border-unalm-700 bg-unalm-50/50 dark:bg-unalm-900/20 text-left transition-colors hover:bg-unalm-50 dark:hover:bg-unalm-900/30">
                  <div class="font-semibold text-sm text-unalm-900 dark:text-unalm-100">Simulacro Completo del Banco</div>
                  <div class="text-xs text-neutral-600 dark:text-neutral-400 mt-1">${allQ.length} preguntas &middot; ${fullMin} minutos</div>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // --- FASE 2: EN CURSO ---
      if (sim.phase === 'running') {
        const q = sim.questions[sim.currentIndex];
        const courseObj = getCourse(q.course);
        const selected = sim.answers[sim.currentIndex];

        const navButtons = sim.questions.map((_, i) => {
          const isCurrent = i === sim.currentIndex;
          const isAnswered = sim.answers[i] !== undefined;
          let cls = 'bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 border-transparent';
          if (isAnswered) cls = 'bg-unalm-700 text-white border-unalm-700';
          if (isCurrent) cls += ' ring-2 ring-neutral-900 dark:ring-white ring-offset-1 dark:ring-offset-neutral-900';

          return `<button onclick="goToSimQuestion(${i})" class="h-8 rounded-md text-xs font-medium border tabular-nums ${cls}">${i + 1}</button>`;
        }).join('');

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 space-y-4">
              <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl px-4 py-3 flex items-center justify-between gap-3">
                <span class="text-xs font-semibold text-neutral-700 dark:text-neutral-200 tabular-nums">
                  Pregunta ${sim.currentIndex + 1} de ${sim.questions.length}
                </span>
                <div class="flex items-center gap-3">
                  <span id="sim-clock" class="font-mono text-sm font-semibold tabular-nums text-neutral-900 dark:text-white">
                    ${formatClock(sim.secondsLeft)}
                  </span>
                  <button onclick="askFinishSimulacro()" class="px-3.5 py-1.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-xs font-medium transition-colors">
                    Finalizar
                  </button>
                </div>
              </div>

              <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 sm:p-6">
                <div class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">
                  <strong class="text-neutral-800 dark:text-neutral-200">${courseObj ? courseObj.name : q.course}</strong> &middot; ${escapeHTML(q.topic)}
                </div>

                <p class="text-sm sm:text-base font-medium text-neutral-900 dark:text-white leading-relaxed mb-5">
                  ${escapeHTML(q.question)}
                </p>

                <div class="space-y-2">
                  ${q.options.map((opt, idx) => {
                    const isSel = selected === idx;
                    return `
                      <button onclick="selectSimOption(${idx})" class="w-full text-left p-3.5 rounded-xl border transition-colors flex items-start gap-3 ${
                        isSel
                          ? 'bg-unalm-50 dark:bg-unalm-900/30 border-unalm-700 text-unalm-900 dark:text-unalm-100'
                          : 'bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-700 hover:border-unalm-600 text-neutral-800 dark:text-neutral-100'
                      }">
                        <span class="w-6 h-6 shrink-0 rounded-md text-xs font-semibold flex items-center justify-center ${
                          isSel ? 'bg-unalm-700 text-white' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300'
                        }">${letters[idx]}</span>
                        <span class="text-sm leading-snug pt-0.5">${escapeHTML(opt)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                <div class="mt-5 pt-4 border-t border-neutral-100 dark:border-neutral-800 flex flex-wrap items-center justify-between gap-2">
                  <button onclick="goToSimQuestion(${sim.currentIndex - 1})" ${sim.currentIndex === 0 ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg text-xs font-medium border border-neutral-200 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 disabled:opacity-40 hover:bg-neutral-50 dark:hover:bg-neutral-800">
                    Anterior
                  </button>

                  ${selected !== undefined ? `
                    <button onclick="clearSimOption()" class="px-3 py-2 rounded-lg text-xs font-medium text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-white underline">
                      Dejar en blanco
                    </button>
                  ` : ''}

                  ${sim.currentIndex < sim.questions.length - 1 ? `
                    <button onclick="goToSimQuestion(${sim.currentIndex + 1})" class="px-4 py-2 rounded-lg text-xs font-medium bg-unalm-700 hover:bg-unalm-800 text-white">
                      Siguiente
                    </button>
                  ` : `
                    <button onclick="askFinishSimulacro()" class="px-4 py-2 rounded-lg text-xs font-medium bg-unalm-700 hover:bg-unalm-800 text-white">
                      Entregar simulacro
                    </button>
                  `}
                </div>
              </div>
            </div>

            <!-- Navegador lateral -->
            <aside class="lg:col-span-4">
              <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-4 sticky top-20">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 mb-3">Navegación</h2>
                <div class="grid grid-cols-5 sm:grid-cols-6 lg:grid-cols-5 gap-1.5">
                  ${navButtons}
                </div>
                <div class="mt-4 pt-3 border-t border-neutral-100 dark:border-neutral-800 flex items-center gap-4 text-xs text-neutral-500 dark:text-neutral-400">
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-unalm-700 inline-block"></span> Marcada</span>
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-neutral-200 dark:bg-neutral-700 inline-block"></span> En blanco</span>
                </div>
              </div>
            </aside>
          </div>
        `;
      }

      // --- FASE 3: RESULTADOS ---
      let correct = 0, incorrect = 0, blank = 0;
      const areaStats = {};
      AREAS.forEach(a => {
        areaStats[a.id] = { name: a.name, total: 0, correct: 0, incorrect: 0, blank: 0 };
      });

      sim.questions.forEach((q, idx) => {
        const c = getCourse(q.course);
        const aId = c ? c.areaId : 'competencias';
        if (!areaStats[aId]) areaStats[aId] = { name: aId, total: 0, correct: 0, incorrect: 0, blank: 0 };
        areaStats[aId].total += 1;

        const ans = sim.answers[idx];
        if (ans === undefined) {
          blank += 1;
          areaStats[aId].blank += 1;
        } else if (ans === q.answer) {
          correct += 1;
          areaStats[aId].correct += 1;
        } else {
          incorrect += 1;
          areaStats[aId].incorrect += 1;
        }
      });

      const finalScore = calcScore(correct, incorrect);
      const maxScore = sim.questions.length * SCORE_CORRECT;

      const areaRowsHtml = Object.values(areaStats)
        .filter(a => a.total > 0)
        .map(a => {
          const areaScore = calcScore(a.correct, a.incorrect);
          return `
            <div class="flex flex-wrap items-center justify-between gap-2 py-2.5 px-3 rounded-lg bg-neutral-50 dark:bg-neutral-800/60 text-xs sm:text-sm">
              <span class="font-medium text-neutral-800 dark:text-neutral-200">${a.name}</span>
              <div class="flex items-center gap-4 tabular-nums text-xs">
                <span class="text-neutral-500 dark:text-neutral-400">${a.correct} bien / ${a.incorrect} mal / ${a.blank} blanco</span>
                <strong class="text-unalm-700 dark:text-unalm-200">${formatScore(areaScore)}</strong>
              </div>
            </div>
          `;
        }).join('');

      const reviewHtml = sim.questions.map((q, idx) => {
        const ans = sim.answers[idx];
        const c = getCourse(q.course);
        let badge = '';
        if (ans === undefined) badge = '<span class="text-xs font-medium text-neutral-500 dark:text-neutral-400">En blanco (0.00)</span>';
        else if (ans === q.answer) badge = '<span class="text-xs font-semibold text-unalm-700 dark:text-unalm-200">Correcta (+1.00)</span>';
        else badge = '<span class="text-xs font-semibold text-red-600 dark:text-red-400">Incorrecta (-0.17)</span>';

        return `
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-4 space-y-2">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <span class="text-neutral-500 dark:text-neutral-400">#${idx + 1} &middot; ${c ? c.name : q.course} &middot; ${escapeHTML(q.topic)}</span>
              ${badge}
            </div>
            <p class="text-sm font-medium text-neutral-900 dark:text-white">${escapeHTML(q.question)}</p>
            <div class="text-xs space-y-1">
              ${ans !== undefined && ans !== q.answer ? `<p class="text-red-600 dark:text-red-400">Tu respuesta: ${letters[ans]}) ${escapeHTML(q.options[ans])}</p>` : ''}
              <p class="text-unalm-700 dark:text-unalm-200 font-medium">Respuesta correcta: ${letters[q.answer]}) ${escapeHTML(q.options[q.answer])}</p>
            </div>
            <p class="text-xs text-neutral-600 dark:text-neutral-400 pt-1 border-t border-neutral-100 dark:border-neutral-800 leading-relaxed">
              ${escapeHTML(q.explanation)}
            </p>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-6">
          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
            <div>
              <div class="text-xs font-medium uppercase tracking-wider text-neutral-500 dark:text-neutral-400">Puntaje Final</div>
              <div class="text-3xl sm:text-4xl font-bold tabular-nums text-unalm-700 dark:text-unalm-200 mt-1">
                ${formatScore(finalScore)} <span class="text-base font-normal text-neutral-500">/ ${maxScore.toFixed(2)}</span>
              </div>
              <div class="flex flex-wrap gap-4 mt-3 text-xs text-neutral-600 dark:text-neutral-400 tabular-nums">
                <span>Correctas: <strong class="text-neutral-900 dark:text-white">${correct}</strong></span>
                <span>Incorrectas: <strong class="text-neutral-900 dark:text-white">${incorrect}</strong></span>
                <span>En blanco: <strong class="text-neutral-900 dark:text-white">${blank}</strong></span>
              </div>
            </div>
            <div>
              <button onclick="state.simulacro.phase='setup'; render();" class="px-4 py-2.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-xs font-medium transition-colors">
                Nuevo simulacro
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 space-y-2.5">
            <h2 class="text-sm font-semibold text-neutral-900 dark:text-white">Resumen por Área</h2>
            ${areaRowsHtml}
          </div>

          <div class="space-y-3">
            <h2 class="text-sm font-semibold text-neutral-900 dark:text-white">Revisión de Respuestas</h2>
            ${reviewHtml}
          </div>
        </div>
      `;
    }

    /* ===========================================================
       9. PESTAÑA 4: BANCO DE PREGUNTAS (AGREGAR / EXPORTAR / IMPORTAR)
       =========================================================== */
    function updateBankTopicsSelect(courseId) {
      const select = document.getElementById('bank-topic-select');
      if (!select) return;
      const course = getCourse(courseId);
      const topics = course ? course.topics : [];
      select.innerHTML = topics.map(t => `<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`).join('');
    }

    function handleAddBankQuestion(e) {
      e.preventDefault();
      const form = e.target;
      const course = form.course.value;
      const topic = form.topic.value;
      const question = form.question.value.trim();
      const options = [
        form.opt0.value.trim(),
        form.opt1.value.trim(),
        form.opt2.value.trim(),
        form.opt3.value.trim(),
        form.opt4.value.trim()
      ];
      const answer = Number(form.answer.value);
      const explanation = form.explanation.value.trim();

      if (!question || options.some(o => !o) || !explanation) {
        showToast('Completa todos los campos antes de guardar.', true);
        return;
      }

      state.customQuestions.unshift({
        id: 'usr-' + Date.now(),
        course,
        topic,
        question,
        options,
        answer,
        explanation
      });

      saveState();
      buildPracticeQueue();
      showToast('Pregunta agregada al banco.');
      render();
    }

    function deleteBankQuestion(id) {
      openConfirmModal(
        'Eliminar pregunta',
        'Esta pregunta personalizada se eliminará permanentemente de tu navegador.',
        () => {
          state.customQuestions = state.customQuestions.filter(q => q.id !== id);
          saveState();
          buildPracticeQueue();
          showToast('Pregunta eliminada.');
          render();
        },
        'Eliminar'
      );
    }

    function exportJSON() {
      const data = JSON.stringify(getAllQuestions(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'practica-unalm-banco.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Banco exportado en formato JSON.');
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed)) throw new Error('Formato no válido');

          const existingIds = new Set(getAllQuestions().map(q => q.id));
          let count = 0;

          parsed.forEach((item, idx) => {
            const validCourse = COURSES.find(c => c.id === item.course);
            if (validCourse && item.question && Array.isArray(item.options) && item.options.length === 5 && typeof item.answer === 'number') {
              const id = item.id && !existingIds.has(item.id) ? item.id : `imp-${Date.now()}-${idx}`;
              if (!existingIds.has(id)) {
                const validTopic = validCourse.topics.includes(item.topic) ? item.topic : validCourse.topics[0];
                state.customQuestions.push({
                  id,
                  course: validCourse.id,
                  topic: validTopic,
                  question: String(item.question),
                  options: item.options.map(String),
                  answer: Math.min(4, Math.max(0, item.answer)),
                  explanation: item.explanation ? String(item.explanation) : 'Sin explicación.'
                });
                existingIds.add(id);
                count += 1;
              }
            }
          });

          saveState();
          buildPracticeQueue();
          showToast(`Se importaron ${count} preguntas nuevas.`);
          render();
        } catch (err) {
          showToast('No se pudo leer el archivo JSON.', true);
        }
      };
      reader.readAsText(file);
    }

    function renderBanco() {
      const firstCourse = COURSES[0];
      const customListHtml = state.customQuestions.length === 0
        ? '<p class="text-xs text-neutral-500 dark:text-neutral-400">No has agregado preguntas personalizadas todavía.</p>'
        : state.customQuestions.map(q => {
            const c = getCourse(q.course);
            return `
              <div class="p-3 rounded-lg bg-neutral-50 dark:bg-neutral-800/60 border border-neutral-200 dark:border-neutral-700 flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="text-[11px] font-medium text-unalm-700 dark:text-unalm-200">${c ? c.name : q.course} &middot; ${escapeHTML(q.topic)}</div>
                  <p class="text-xs text-neutral-800 dark:text-neutral-200 mt-0.5 line-clamp-2">${escapeHTML(q.question)}</p>
                </div>
                <button onclick="deleteBankQuestion('${q.id}')" class="shrink-0 text-xs font-medium text-red-600 dark:text-red-400 hover:underline">
                  Eliminar
                </button>
              </div>
            `;
          }).join('');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-7 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 sm:p-6">
            <h1 class="text-lg font-bold text-neutral-900 dark:text-white">Agregar Pregunta</h1>
            <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1 mb-5">
              Asigna cada pregunta a un curso y tema exacto del Temario Oficial UNALM.
            </p>

            <form onsubmit="handleAddBankQuestion(event)" class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300 mb-1">Curso</label>
                  <select name="course" onchange="updateBankTopicsSelect(this.value)" class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700">
                    ${COURSES.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300 mb-1">Tema oficial</label>
                  <select id="bank-topic-select" name="topic" class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700">
                    ${firstCourse.topics.map(t => `<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300 mb-1">Enunciado</label>
                <textarea name="question" rows="3" required placeholder="Escribe la pregunta..." class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700"></textarea>
              </div>

              <div class="space-y-2">
                <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300">Alternativas (A - E)</label>
                ${['A', 'B', 'C', 'D', 'E'].map((l, i) => `
                  <div class="flex items-center gap-2">
                    <span class="w-6 h-6 shrink-0 rounded bg-neutral-100 dark:bg-neutral-800 text-xs font-semibold flex items-center justify-center text-neutral-600 dark:text-neutral-300">${l}</span>
                    <input name="opt${i}" required placeholder="Alternativa ${l}" class="w-full px-3 py-1.5 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700" />
                  </div>
                `).join('')}
              </div>

              <div>
                <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300 mb-1">Respuesta correcta</label>
                <select name="answer" class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700">
                  <option value="0">Alternativa A</option>
                  <option value="1">Alternativa B</option>
                  <option value="2">Alternativa C</option>
                  <option value="3">Alternativa D</option>
                  <option value="4">Alternativa E</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-medium text-neutral-700 dark:text-neutral-300 mb-1">Explicación breve</label>
                <textarea name="explanation" rows="2" required placeholder="Explica el fundamento de la respuesta..." class="w-full px-3 py-2 rounded-lg bg-neutral-50 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 text-sm focus:outline-none focus:ring-1 focus:ring-unalm-700"></textarea>
              </div>

              <button type="submit" class="w-full py-2.5 rounded-lg bg-unalm-700 hover:bg-unalm-800 text-white text-sm font-medium transition-colors">
                Guardar en el banco
              </button>
            </form>
          </div>

          <div class="lg:col-span-5 space-y-5">
            <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 space-y-3">
              <h2 class="text-sm font-semibold text-neutral-900 dark:text-white">Exportar e Importar JSON</h2>
              <p class="text-xs text-neutral-500 dark:text-neutral-400">
                Banco actual: ${getAllQuestions().length} preguntas (${INITIAL_QUESTIONS.length} base y ${state.customQuestions.length} personalizadas).
              </p>
              <div class="flex gap-2">
                <button onclick="exportJSON()" class="flex-1 px-3 py-2 rounded-lg border border-unalm-700 text-unalm-700 dark:text-unalm-200 hover:bg-unalm-50 dark:hover:bg-unalm-900/30 text-xs font-medium transition-colors">
                  Exportar JSON
                </button>
                <label class="flex-1 text-center cursor-pointer px-3 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-50 dark:hover:bg-neutral-800 text-xs font-medium transition-colors">
                  Importar JSON
                  <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
                </label>
              </div>
            </div>

            <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl p-5 space-y-3">
              <h2 class="text-sm font-semibold text-neutral-900 dark:text-white">Preguntas Personalizadas (${state.customQuestions.length})</h2>
              <div class="space-y-2 max-h-80 overflow-y-auto">
                ${customListHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* ===========================================================
       10. INICIALIZACIÓN
       =========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      buildPracticeQueue();
      updateCountdown();
      setInterval(updateCountdown, 1000);
      render();
    });
  </script>
</body>
</html>
